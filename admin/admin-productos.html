<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — Panel de administración</title>
<link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="marca"><img src="../img/logo.png" alt="Gas El Volcán" class="marca__logo"></div>
    <nav class="admin-nav">
      <a class="admin-nav__enlace" href="admin-inicio.html">📊 Inicio</a>
      <a class="admin-nav__enlace admin-nav__enlace--activo" href="admin-productos.html">🧯 Productos</a>
      <a class="admin-nav__enlace" href="admin-usuarios.html">👤 Usuarios</a>
      <a class="admin-nav__enlace" href="../login.html">🚪 Cerrar sesión</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Mantenedor de productos</h1>
    </div>

    <div class="admin-panel">
      <table class="tabla-admin">
        <thead>
          <tr><th>Código</th><th>Nombre</th><th>Formato</th><th>Precio</th><th>Stock</th><th></th></tr>
        </thead>
        <tbody id="tabla-productos-cuerpo"></tbody>
      </table>
    </div>

    <div class="admin-panel oculto" id="panel-form-producto">
      <h3 id="form-producto-titulo" style="margin-top:0;">Editar producto</h3>
      <form onsubmit="return guardarProducto(event)">
        <div class="campo">
          <label for="prod-nombre">Nombre</label>
          <input type="text" id="prod-nombre" required>
        </div>
        <div class="campo--dos">
          <div class="campo">
            <label for="prod-precio">Precio (CLP)</label>
            <input type="number" id="prod-precio" min="0" required>
          </div>
          <div class="campo">
            <label for="prod-stock">Stock disponible</label>
            <input type="number" id="prod-stock" min="0" required>
          </div>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="boton boton--primario">Guardar cambios</button>
          <button type="button" class="boton boton--secundario" onclick="cerrarEdicionProducto()">Cancelar</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="../js/catalogo.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
