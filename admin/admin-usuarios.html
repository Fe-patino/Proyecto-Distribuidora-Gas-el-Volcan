<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios — Panel de administración</title>
<link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="marca"><span class="marca__icono">🔥</span> Gas El Volcán</div>
    <nav class="admin-nav">
      <a class="admin-nav__enlace" href="admin-inicio.html">📊 Inicio</a>
      <a class="admin-nav__enlace" href="admin-productos.html">🧯 Productos</a>
      <a class="admin-nav__enlace admin-nav__enlace--activo" href="admin-usuarios.html">👤 Usuarios</a>
      <a class="admin-nav__enlace" href="../login.html">🚪 Cerrar sesión</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Mantenedor de usuarios</h1>
      <button class="boton boton--primario" onclick="abrirCreacionUsuario()">+ Nuevo usuario</button>
    </div>

    <div class="admin-panel">
      <table class="tabla-admin">
        <thead>
          <tr><th>RUN</th><th>Nombre</th><th>Correo</th><th>Rol</th><th></th></tr>
        </thead>
        <tbody id="tabla-usuarios-cuerpo"></tbody>
      </table>
    </div>

    <div class="admin-panel oculto" id="panel-form-usuario">
      <h3 id="form-usuario-titulo" style="margin-top:0;">Nuevo usuario</h3>
      <form id="form-usuario" onsubmit="return guardarUsuario(event)">
        <div class="campo--dos">
          <div class="campo">
            <label for="usr-run">RUN (sin puntos ni guion)</label>
            <input type="text" id="usr-run" maxlength="9" required>
          </div>
          <div class="campo">
            <label for="usr-tipo">Rol</label>
            <select id="usr-tipo" required>
              <option value="cliente">Cliente</option>
              <option value="administrador">Administrador</option>
            </select>
          </div>
        </div>
        <div class="campo--dos">
          <div class="campo">
            <label for="usr-nombre">Nombre</label>
            <input type="text" id="usr-nombre" maxlength="50" required>
          </div>
          <div class="campo">
            <label for="usr-apellidos">Apellidos</label>
            <input type="text" id="usr-apellidos" maxlength="100" required>
          </div>
        </div>
        <div class="campo">
          <label for="usr-correo">Correo electrónico</label>
          <input type="email" id="usr-correo" maxlength="100" required>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="boton boton--primario">Guardar usuario</button>
          <button type="button" class="boton boton--secundario" onclick="cerrarEdicionUsuario()">Cancelar</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="../js/catalogo.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
